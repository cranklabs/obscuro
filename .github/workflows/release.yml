name: Release

# Release Please keeps one release PR up to date on every push to main.
# Merging that PR creates the vX.Y.Z tag and a draft GitHub Release; the full
# CI suite then runs on that exact commit, and the binaries are built from it,
# signed, uploaded, and only then is the release published and marked latest.
# There is deliberately no manual trigger: recover with "Re-run failed jobs".

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # PRs created or updated with GITHUB_TOKEN don't trigger pull_request
  # workflows, so run CI on the release PR branch explicitly.
  release-pr-ci:
    name: Dispatch CI for the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ needs.release-please.outputs.prs }}
        run: |
          set -euo pipefail
          jq -r '.[].headBranchName' <<<"$PRS" | while read -r branch; do
            echo "Dispatching CI on $branch"
            gh workflow run ci.yml --ref "$branch"
          done

  ci:
    name: CI on the release commit
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.sha }}

  binaries:
    name: Build, sign & publish binaries
    needs: [release-please, ci]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.release-please.outputs.tag }}
      SHA: ${{ needs.release-please.outputs.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Check the release tag, commit and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Unexpected release tag: $VERSION" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(jq -r '."."' .release-please-manifest.json)" = "${VERSION#v}"
          git fetch --no-tags --depth=1 origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
          test "$(git rev-parse "${VERSION}^{commit}")" = "$SHA"
          status=$(gh api "repos/${GH_REPO}/compare/${SHA}...main" --jq .status)
          case "$status" in ahead|identical) ;; *) echo "$SHA is not on main ($status)" >&2; exit 1 ;; esac
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build cross-platform binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/janklabs/obscuro/internal/version.Version=${VERSION}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for t in "${targets[@]}"; do
            GOOS="${t%/*}"
            GOARCH="${t#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
            name="obscuro-${VERSION}-${GOOS}-${GOARCH}${EXT}"
            echo "Building $name"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/${name}" .
          done

      - name: Check the version reported by the linux/amd64 binary
        run: |
          set -euo pipefail
          out=$(OBSCURO_NO_UPDATE_CHECK=1 "dist/obscuro-${VERSION}-linux-amd64" version)
          echo "$out"
          test "$out" = "obscuro ${VERSION}"

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum obscuro-* > checksums.txt
          cat checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign release artifacts (cosign keyless)
        working-directory: dist
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          # Keyless signing using GitHub's OIDC token. Verify with:
          #   cosign verify-blob \
          #     --certificate-identity-regexp '^https://github\.com/cranklabs/obscuro/\.github/workflows/release\.yml@refs/heads/main$' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     --signature obscuro-vX.Y.Z-linux-amd64.sig \
          #     --certificate obscuro-vX.Y.Z-linux-amd64.pem \
          #     obscuro-vX.Y.Z-linux-amd64
          for f in obscuro-* checksums.txt; do
            [ -f "$f" ] || continue
            echo "Signing $f"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" dist/* --clobber
          expected=$(cd dist && find . -maxdepth 1 -type f -printf '%f\n' | sort)
          uploaded=$(gh release view "$VERSION" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | sort)
          if [ "$expected" != "$uploaded" ]; then
            echo "Release assets do not match the built files" >&2
            diff <(echo "$expected") <(echo "$uploaded") >&2 || true
            exit 1
          fi

      - name: Publish the release and mark it latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --draft=false --latest
